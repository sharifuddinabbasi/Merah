<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehran Account</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm">
                    <i class="fa-solid fa-wallet text-2xl text-yellow-300"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">Mehran Account</h1>
                    <p class="text-xs text-blue-200">Financial Ledger & Transactions Record</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow">

        <!-- Controls / Search Bar & Add Row Button -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="searchInput" oninput="renderTable()" placeholder="Search description, status or date..." 
                    class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            </div>
            <button onclick="addNewRow()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2 text-sm">
                <i class="fa-solid fa-plus"></i> New Row
            </button>
        </div>

        <!-- Table Section -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-100 text-xs uppercase text-gray-500 font-semibold tracking-wider">
                            <th class="py-3.5 px-4">Sr. No.</th>
                            <th class="py-3.5 px-4">Date</th>
                            <th class="py-3.5 px-4">Description</th>
                            <th class="py-3.5 px-4">Status</th>
                            <th class="py-3.5 px-4 text-right">DHRM</th>
                            <th class="py-3.5 px-4 text-right">Total</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100 text-sm">
                        <!-- Dynamic rows will be inserted here -->
                    </tbody>
                </table>
            </div>
            <!-- Loading State -->
            <div id="loadingState" class="py-12 text-center">
                <div class="text-blue-600 text-3xl mb-3 animate-spin">
                    <i class="fa-solid fa-spinner"></i>
                </div>
                <p class="text-gray-500 font-medium">Loading entries from Firebase...</p>
            </div>
            <!-- Empty State -->
            <div id="emptyState" class="hidden py-12 text-center">
                <div class="text-gray-300 text-4xl mb-3">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <p class="text-gray-500 font-medium">No records found</p>
                <p class="text-gray-400 text-xs mt-1">Click on "New Row" to create a new entry.</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-100 py-4 mt-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500">
            Mehran Account &copy; 2026. All rights reserved.
        </div>
    </footer>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Application Script -->
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBzfFC_2auZDd4H1-iKYUkw1Kvx5teqTEs",
          authDomain: "mehran-61aec.firebaseapp.com",
          projectId: "mehran-61aec",
          storageBucket: "mehran-61aec.firebasestorage.app",
          messagingSenderId: "1056157659000",
          appId: "1:1056157659000:web:2229be50d1c11ff9d5e28d",
          measurementId: "G-B9RXSL6BKJ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let entries = [];

        function loadEntries() {
            db.collection("mehran_entries")
              .orderBy("date", "asc")
              .onSnapshot((snapshot) => {
                  entries = [];
                  snapshot.forEach((doc) => {
                      entries.push({ id: doc.id, ...doc.data() });
                  });
                  document.getElementById('loadingState').classList.add('hidden');
                  renderTable();
              }, (error) => {
                  console.error("Error fetching data: ", error);
                  document.getElementById('loadingState').classList.add('hidden');
                  alert("Failed to load data from Firebase.");
              });
        }

        async function addNewRow() {
            const today = new Date().toISOString().split('T')[0];
            try {
                await db.collection("mehran_entries").add({
                    date: today,
                    desc: "New Description",
                    status: "Pending",
                    dhrm: 0,
                    total: 0,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (error) {
                console.error("Error adding row: ", error);
                alert("Failed to add new row.");
            }
        }

        function renderTable() {
            const tableBody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            tableBody.innerHTML = "";

            const filteredEntries = entries.filter(item => 
                (item.desc && item.desc.toLowerCase().includes(searchTerm)) || 
                (item.status && item.status.toLowerCase().includes(searchTerm)) || 
                (item.date && item.date.includes(searchTerm))
            );

            if (filteredEntries.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filteredEntries.forEach((item, index) => {
                const row = document.createElement('tr');
                row.className = "hover:bg-gray-50/80 transition";
                row.innerHTML = `
                    <td class="py-3 px-4 font-medium text-gray-600">${index + 1}</td>
                    <td class="py-3 px-4 text-gray-600 cursor-pointer hover:bg-blue-50 transition" ondblclick="makeEditable(this, '${item.id}', 'date', '${item.date || ''}', 'date')">${item.date || ''}</td>
                    <td class="py-3 px-4 font-medium text-gray-800 cursor-pointer hover:bg-blue-50 transition" ondblclick="makeEditable(this, '${item.id}', 'desc', '${escapeHtml(item.desc || '')}', 'text')">${escapeHtml(item.desc || '')}</td>
                    <td class="py-3 px-4 text-gray-700 cursor-pointer hover:bg-blue-50 transition" ondblclick="makeEditable(this, '${item.id}', 'status', '${escapeHtml(item.status || '')}', 'text')"><span class="bg-blue-50 text-blue-700 px-2.5 py-1 rounded-full text-xs font-medium">${escapeHtml(item.status || '-')}</span></td>
                    <td class="py-3 px-4 text-right text-gray-700 cursor-pointer hover:bg-blue-50 transition" ondblclick="makeEditable(this, '${item.id}', 'dhrm', '${item.dhrm || 0}', 'number')">${(item.dhrm || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                    <td class="py-3 px-4 text-right font-semibold text-blue-600">${(item.total || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Excel-like double click inline editing
        function makeEditable(cell, id, field, currentValue, type) {
            if (cell.querySelector('input')) return;

            const originalContent = cell.innerHTML;
            cell.innerHTML = `<input type="${type}" value="${currentValue}" class="w-full px-2 py-1 border border-blue-500 rounded text-sm bg-white focus:outline-none" autofocus>`;
            
            const input = cell.querySelector('input');
            input.focus();

            async function saveChanges() {
                let newValue = input.value;
                if (type === 'number') {
                    newValue = parseFloat(newValue) || 0;
                }

                const item = entries.find(e => e.id === id);
                if (!item) return;

                item[field] = newValue;
                if (field === 'dhrm') {
                    item.total = newValue; // Total equals DHRM
                }

                try {
                    const updateData = { [field]: newValue };
                    if (field === 'dhrm') {
                        updateData.total = newValue;
                    }
                    await db.collection("mehran_entries").doc(id).update(updateData);
                    renderTable();
                } catch (error) {
                    console.error("Error updating: ", error);
                    alert("Failed to update entry.");
                    cell.innerHTML = originalContent;
                }
            }

            input.addEventListener('blur', saveChanges);
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    input.blur();
                } else if (e.key === 'Escape') {
                    cell.innerHTML = originalContent;
                }
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        loadEntries();
    </script>
</body>
</html>
