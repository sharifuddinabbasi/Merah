<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehran Account - View Only</title>
    
    <!-- Alag manifest link user.html ke liye -->
    <link rel="manifest" href="user-manifest.json?v=2">
    <meta name="theme-color" content="#1d4ed8">
    <link rel="icon" type="image/png" href="icon.png?v=2">
    <link rel="apple-touch-icon" href="icon.png?v=2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mehran View">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <img src="icon.png?v=2" alt="Logo" class="w-11 h-11 rounded-xl shadow-sm bg-white p-0.5 object-contain" onerror="this.style.display='none'">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">Mehran Account</h1>
                    <p class="text-xs text-blue-200">Financial Ledger & Transactions Record (View Only)</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <!-- Install App Button for user.html -->
                <button id="installAppBtn" onclick="installPWA()" class="hidden bg-green-500 hover:bg-green-600 text-white font-semibold px-3 py-2 rounded-lg shadow transition flex items-center gap-1.5 text-sm">
                    <i class="fa-solid fa-download"></i> Install App
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-2 sm:px-4 py-6 w-full flex-grow">

        <!-- Search Bar Only -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="searchInput" oninput="renderTable()" placeholder="Search description, status or date..." 
                    class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            </div>
        </div>

        <!-- Table Section -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-300 overflow-hidden max-w-[580px] mx-auto">
            <div class="overflow-x-auto">
                <table class="w-[580px] text-left border-collapse table-fixed">
                    <thead>
                        <tr class="bg-gray-100 text-[11px] uppercase text-gray-700 font-bold tracking-wider">
                            <th class="py-2.5 px-1 border border-gray-300 text-center" style="width: 6%;">Sr. No.</th>
                            <th class="py-2.5 px-1 border border-gray-300 text-center" style="width: 8%;">Date</th>
                            <th class="py-2.5 px-1 border border-gray-300" style="width: 28%;">Description</th>
                            <th class="py-2.5 px-1 border border-gray-300" style="width: 28%;">Status</th>
                            <th class="py-2.5 px-1 border border-gray-300 text-right" style="width: 15%;">DHRM</th>
                            <th class="py-2.5 px-1 border border-gray-300 text-right" style="width: 15%;">Total</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-xs">
                        <!-- Dynamic rows will be inserted here -->
                    </tbody>
                    <tfoot id="tableFooter" class="bg-gray-100 font-bold text-xs hidden">
                        <tr>
                            <td colspan="4" class="py-2.5 px-1 border border-gray-300 text-right text-gray-800 uppercase">Grand Total</td>
                            <td id="grandTotalDhrm" class="py-2.5 px-1 border border-gray-300 text-right text-gray-900">0.00</td>
                            <td id="grandTotalFinal" class="py-2.5 px-1 border border-gray-300 text-right text-blue-700">0.00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <!-- Loading State -->
            <div id="loadingState" class="py-12 text-center">
                <div class="text-blue-600 text-3xl mb-3 animate-spin">
                    <i class="fa-solid fa-spinner"></i>
                </div>
                <p class="text-gray-500 font-medium">Loading entries from Firebase...</p>
            </div>
            <!-- Empty State -->
            <div id="emptyState" class="hidden py-12 text-center">
                <div class="text-gray-300 text-4xl mb-3">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <p class="text-gray-500 font-medium">No records found</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-4 mt-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500">
            Mehran Account &copy; 2026. All rights reserved.
        </div>
    </footer>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Application Script -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js?v=2').catch(err => console.log('SW fail:', err));
            });
        }

        let deferredPrompt;
        const installAppBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installAppBtn.classList.remove('hidden');
        });

        async function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installAppBtn.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        }

        const firebaseConfig = {
          apiKey: "AIzaSyBzfFC_2auZDd4H1-iKYUkw1Kvx5teqTEs",
          authDomain: "mehran-61aec.firebaseapp.com",
          projectId: "mehran-61aec",
          storageBucket: "mehran-61aec.firebasestorage.app",
          messagingSenderId: "1056157659000",
          appId: "1:1056157659000:web:2229be50d1c11ff9d5e28d",
          measurementId: "G-B9RXSL6BKJ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let entries = [];

        function formatDateTwoLines(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                const year = parts[0];
                const month = parts[1];
                const day = parts[2];
                return `<div class="leading-tight"><div>${day}-${month}</div><div class="text-[10px] text-gray-500">${year}</div></div>`;
            }
            return dateStr;
        }

        function getTimeValue(createdAt) {
            if (!createdAt) return 0;
            if (typeof createdAt === 'number') return createdAt;
            if (typeof createdAt.toMillis === 'function') return createdAt.toMillis();
            if (createdAt.seconds) return createdAt.seconds * 1000;
            return 0;
        }

        function loadEntries() {
            db.collection("mehran_entries")
              .onSnapshot((snapshot) => {
                  entries = [];
                  snapshot.forEach((doc) => {
                      const data = doc.data();
                      if (data.pkr !== undefined && data.desc !== "New Description") {
                          entries.push({ id: doc.id, ...data });
                      }
                  });

                  entries.sort((a, b) => {
                      const dateA = a.date || '';
                      const dateB = b.date || '';
                      if (dateA !== dateB) {
                          return dateA.localeCompare(dateB);
                      }
                      const timeA = getTimeValue(a.createdAt);
                      const timeB = getTimeValue(b.createdAt);
                      const finalTimeA = timeA === 0 ? Number.MAX_SAFE_INTEGER : timeA;
                      const finalTimeB = timeB === 0 ? Number.MAX_SAFE_INTEGER : timeB;
                      return finalTimeA - finalTimeB;
                  });

                  document.getElementById('loadingState').classList.add('hidden');
                  renderTable();
              }, (error) => {
                  console.error("Error fetching data: ", error);
                  document.getElementById('loadingState').classList.add('hidden');
                  alert("Failed to load data from Firebase.");
              });
        }

        function renderTable() {
            const tableBody = document.getElementById('tableBody');
            const tableFooter = document.getElementById('tableFooter');
            const emptyState = document.getElementById('emptyState');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            tableBody.innerHTML = "";

            let runningTotal = 0;
            const entriesWithRunningTotal = entries.map(item => {
                const dhrmVal = parseFloat(item.dhrm) || 0;
                const isPending = (item.status || "").trim().toLowerCase() === "pending";
                
                if (!isPending) {
                    runningTotal += dhrmVal;
                }
                return { ...item, calculatedTotal: runningTotal };
            });

            const filteredEntries = entriesWithRunningTotal.filter(item => {
                return (item.desc && item.desc.toLowerCase().includes(searchTerm)) || 
                       (item.status && item.status.toLowerCase().includes(searchTerm)) || 
                       (item.date && item.date.includes(searchTerm));
            });

            if (filteredEntries.length === 0) {
                emptyState.classList.remove('hidden');
                tableFooter.classList.add('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
                tableFooter.classList.remove('hidden');
            }

            let sumDhrm = 0;

            filteredEntries.forEach((item, index) => {
                const dhrmVal = parseFloat(item.dhrm) || 0;
                const isPending = (item.status || "").trim().toLowerCase() === "pending";

                if (!isPending) {
                    sumDhrm += dhrmVal;
                }

                const rowBgClass = isPending ? "bg-red-50 hover:bg-red-100 transition" : "hover:bg-gray-50 transition";

                const row = document.createElement('tr');
                row.className = rowBgClass;
                row.innerHTML = `
                    <td class="py-2 px-1 border border-gray-300 font-medium text-gray-600 text-center">${index + 1}</td>
                    <td class="py-2 px-1 border border-gray-300 text-gray-700 text-center whitespace-nowrap">${formatDateTwoLines(item.date)}</td>
                    <td class="py-2 px-1 border border-gray-300 font-medium text-gray-800">${escapeHtml(item.desc || '')}</td>
                    <td class="py-2 px-1 border border-gray-300 text-gray-700"><span class="${isPending ? 'bg-red-100 text-red-700' : 'bg-blue-50 text-blue-700'} px-1 py-0.5 rounded-full text-[11px] font-medium">${escapeHtml(item.status || '-')}</span></td>
                    <td class="py-2 px-1 border border-gray-300 text-right text-gray-700">${dhrmVal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td class="py-2 px-1 border border-gray-300 text-right font-semibold text-blue-600">${Number(item.calculatedTotal || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                `;
                tableBody.appendChild(row);
            });

            document.getElementById('grandTotalDhrm').innerText = sumDhrm.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('grandTotalFinal').innerText = sumDhrm.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        loadEntries();
    </script>
</body>
</html>
