<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehran Account</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm">
                    <i class="fa-solid fa-wallet text-2xl text-yellow-300"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">Mehran Account</h1>
                    <p class="text-xs text-blue-200">Financial Ledger & Transactions Record</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openModal()" class="bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-plus"></i> Add Entry
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow">

        <!-- Controls / Search Bar -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="searchInput" oninput="renderTable()" placeholder="Search description or date..." 
                    class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            </div>
        </div>

        <!-- Table Section -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-100 text-xs uppercase text-gray-500 font-semibold tracking-wider">
                            <th class="py-3.5 px-4">Sr. No.</th>
                            <th class="py-3.5 px-4">Date</th>
                            <th class="py-3.5 px-4">Description</th>
                            <th class="py-3.5 px-4 text-right">PKR</th>
                            <th class="py-3.5 px-4 text-right">DHRM</th>
                            <th class="py-3.5 px-4 text-right">Total</th>
                            <th class="py-3.5 px-4 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100 text-sm">
                        <!-- Dynamic rows will be inserted here -->
                    </tbody>
                </table>
            </div>
            <!-- Loading State -->
            <div id="loadingState" class="py-12 text-center">
                <div class="text-blue-600 text-3xl mb-3 animate-spin">
                    <i class="fa-solid fa-spinner"></i>
                </div>
                <p class="text-gray-500 font-medium">Loading entries from Firebase...</p>
            </div>
            <!-- Empty State -->
            <div id="emptyState" class="hidden py-12 text-center">
                <div class="text-gray-300 text-4xl mb-3">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <p class="text-gray-500 font-medium">No records found</p>
                <p class="text-gray-400 text-xs mt-1">Click on "Add Entry" to create a new transaction record.</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-100 py-4 mt-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500">
            Mehran Account &copy; 2026. All rights reserved.
        </div>
    </footer>

    <!-- Add/Edit Modal -->
    <div id="entryModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="bg-blue-700 px-6 py-4 text-white flex justify-between items-center">
                <h3 id="modalTitle" class="font-semibold text-lg">Add New Entry</h3>
                <button onclick="closeModal()" class="text-white/80 hover:text-white text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="entryForm" onsubmit="saveEntry(event)" class="p-6 space-y-4">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Date</label>
                    <input type="date" id="entryDate" required
                        class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Description</label>
                    <input type="text" id="entryDesc" placeholder="Enter description..." required
                        class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">PKR Amount</label>
                        <input type="number" step="any" id="entryPkr" placeholder="0.00" oninput="calculateTotalPreview()"
                            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">DHRM Amount</label>
                        <input type="number" step="any" id="entryDhrm" placeholder="0.00" oninput="calculateTotalPreview()"
                            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Total (Calculated)</label>
                    <input type="text" id="entryTotal" readonly placeholder="0.00"
                        class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm font-semibold text-gray-700">
                </div>
                <div class="flex justify-end gap-2 pt-3 border-t border-gray-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-gray-200 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 transition">Cancel</button>
                    <button type="submit" id="saveBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold shadow transition">Save Entry</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Application Script -->
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBzfFC_2auZDd4H1-iKYUkw1Kvx5teqTEs",
          authDomain: "mehran-61aec.firebaseapp.com",
          projectId: "mehran-61aec",
          storageBucket: "mehran-61aec.firebasestorage.app",
          messagingSenderId: "1056157659000",
          appId: "1:1056157659000:web:2229be50d1c11ff9d5e28d",
          measurementId: "G-B9RXSL6BKJ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let entries = [];

        document.getElementById('entryDate').valueAsDate = new Date();

        function loadEntries() {
            db.collection("mehran_entries")
              .orderBy("date", "asc")
              .onSnapshot((snapshot) => {
                  entries = [];
                  snapshot.forEach((doc) => {
                      entries.push({ id: doc.id, ...doc.data() });
                  });
                  document.getElementById('loadingState').classList.add('hidden');
                  renderTable();
              }, (error) => {
                  console.error("Error fetching data: ", error);
                  document.getElementById('loadingState').classList.add('hidden');
                  alert("Failed to load data from Firebase.");
              });
        }

        function openModal(id = null) {
            const modal = document.getElementById('entryModal');
            const form = document.getElementById('entryForm');
            const modalTitle = document.getElementById('modalTitle');
            
            modal.classList.remove('hidden');
            
            if (id !== null) {
                modalTitle.innerText = "Edit Entry";
                document.getElementById('editId').value = id;
                const item = entries.find(e => e.id === id);
                if (item) {
                    document.getElementById('entryDate').value = item.date;
                    document.getElementById('entryDesc').value = item.desc;
                    document.getElementById('entryPkr').value = item.pkr;
                    document.getElementById('entryDhrm').value = item.dhrm;
                    document.getElementById('entryTotal').value = item.total;
                }
            } else {
                modalTitle.innerText = "Add New Entry";
                form.reset();
                document.getElementById('editId').value = "";
                document.getElementById('entryDate').valueAsDate = new Date();
                document.getElementById('entryTotal').value = "0.00";
            }
        }

        function closeModal() {
            document.getElementById('entryModal').classList.add('hidden');
        }

        function calculateTotalPreview() {
            const pkr = parseFloat(document.getElementById('entryPkr').value) || 0;
            const dhrm = parseFloat(document.getElementById('entryDhrm').value) || 0;
            const total = pkr + dhrm; 
            document.getElementById('entryTotal').value = total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        async function saveEntry(e) {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const date = document.getElementById('entryDate').value;
            const desc = document.getElementById('entryDesc').value;
            const pkr = parseFloat(document.getElementById('entryPkr').value) || 0;
            const dhrm = parseFloat(document.getElementById('entryDhrm').value) || 0;
            const total = pkr + dhrm;

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.innerText = "Saving...";

            try {
                if (editId === "") {
                    await db.collection("mehran_entries").add({
                        date,
                        desc,
                        pkr,
                        dhrm,
                        total,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } else {
                    await db.collection("mehran_entries").doc(editId).update({
                        date,
                        desc,
                        pkr,
                        dhrm,
                        total
                    });
                }
                closeModal();
            } catch (error) {
                console.error("Error saving document: ", error);
                alert("Error saving entry to Firebase.");
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = "Save Entry";
            }
        }

        function renderTable() {
            const tableBody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            tableBody.innerHTML = "";

            const filteredEntries = entries.filter(item => 
                item.desc.toLowerCase().includes(searchTerm) || 
                item.date.includes(searchTerm)
            );

            if (filteredEntries.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filteredEntries.forEach((item, index) => {
                const row = document.createElement('tr');
                row.className = "hover:bg-gray-50/80 transition";
                row.innerHTML = `
                    <td class="py-3 px-4 font-medium text-gray-600">${index + 1}</td>
                    <td class="py-3 px-4 text-gray-600">${item.date}</td>
                    <td class="py-3 px-4 font-medium text-gray-800">${escapeHtml(item.desc)}</td>
                    <td class="py-3 px-4 text-right text-gray-700">${item.pkr.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                    <td class="py-3 px-4 text-right text-gray-700">${item.dhrm.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                    <td class="py-3 px-4 text-right font-semibold text-blue-600">${item.total.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                    <td class="py-3 px-4 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <button onclick="openModal('${item.id}')" class="p-1.5 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded transition" title="Edit">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button onclick="deleteEntry('${item.id}')" class="p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded transition" title="Delete">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        async function deleteEntry(id) {
            if (confirm("Are you sure you want to delete this entry?")) {
                try {
                    await db.collection("mehran_entries").doc(id).delete();
                } catch (error) {
                    console.error("Error deleting document: ", error);
                    alert("Failed to delete entry.");
                }
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        loadEntries();
    </script>
</body>
</html>
